[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "heschema"
version = "0.1.0"
description = "Paired experiments for JSON Schema effects on LLM tool arguments"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.27,<1",
  "jsonschema[format]>=4.23,<5", "python-dotenv>=1,<2",
  "numpy>=2,<3", "scipy>=1.14,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
heschema = "heschema.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
