name: test
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      - run: heschema dataset
      - run: heschema benchmark --provider mock --limit 8 --repeats 1 --out results/ci
  blaze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[dev]'
      - run: npm ci --prefix native
      - run: HESCHEMA_TEST_BLAZE=1 JSONSCHEMA_CLI="$PWD/native/node_modules/.bin/jsonschema" pytest -q tests/test_blaze.py
