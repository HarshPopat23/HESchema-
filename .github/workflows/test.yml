name: test
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: python scripts/build_60_tasks_pack.py --check
      - run: pytest -q
      - run: heschema dataset
      - run: heschema research-audit
      - run: python -m heschema.confirmation_run
      - run: python scripts/verify_confirmation_evidence.py
      - run: heschema benchmark --provider mock --limit 8 --repeats 1 --out results/ci
      - run: heschema evidence-audit results/ci
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check frontend/app.js
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: heschema decoding-study
      - run: heschema decoding-study --execute --provider mock --max-requests 24 --out results/ci-decoding
      - run: heschema repair-study --execute --provider mock --first-out results/ci-decoding --max-requests 216 --out results/ci-repair
  blaze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[dev]'
      - run: npm ci --prefix native
      - run: HESCHEMA_TEST_BLAZE=1 JSONSCHEMA_CLI="$PWD/native/node_modules/.bin/jsonschema" pytest -q tests/test_blaze.py tests/test_validator_controls.py tests/test_validator_references.py
      - run: JSONSCHEMA_CLI="$PWD/native/node_modules/.bin/jsonschema" heschema research-audit --engine blaze

  postgres-registry:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: heschema
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: heschema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heschema -d heschema_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      HESCHEMA_TEST_POSTGRES_DSN: postgresql://heschema:disposable-ci-password@localhost:5432/heschema_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python scripts/check_registry_postgres.py before "$RUNNER_TEMP/registry-restart.json"
      - name: Restart the actual PostgreSQL server
        run: docker restart "${{ job.services.postgres.id }}"
      - run: python scripts/check_registry_postgres.py after "$RUNNER_TEMP/registry-restart.json"
